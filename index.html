<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Emraan Hashmi Era</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:radial-gradient(circle at top,#292929 0%,#090909 45%,#000 100%);
  color:#fff;font-family:Arial,Helvetica,sans-serif;
  display:flex;justify-content:center;align-items:center;padding:25px
}
.container{width:100%;max-width:430px;text-align:center}
.online{font-size:12px;color:#999;margin-bottom:25px;letter-spacing:2px}
.online span{color:#35e58b}
.title{font-size:27px;font-weight:800;letter-spacing:3px;margin-bottom:6px}
.subtitle{color:#999;font-size:12px;letter-spacing:3px;margin-bottom:28px}
.cover{
  width:290px;height:290px;margin:auto;border-radius:18px;overflow:hidden;
  background:linear-gradient(135deg,#333,#111);
  box-shadow:0 25px 70px rgba(0,0,0,.8);
  display:flex;align-items:center;justify-content:center;color:#777;font-size:14px
}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.song{margin-top:25px}
.song h2{font-size:21px;margin-bottom:6px}
.song p{color:#888;font-size:14px}
.progress-area{margin-top:25px}
input[type=range]{width:100%;accent-color:white}
.time{display:flex;justify-content:space-between;color:#777;font-size:11px;margin-top:5px}
.controls{margin-top:22px;display:flex;justify-content:center;align-items:center;gap:20px}
button{border:none;background:transparent;color:white;cursor:pointer}
.play{width:62px;height:62px;border-radius:50%;background:white;color:#000;font-size:23px}
.small{font-size:20px;color:#aaa}
.footer{margin-top:35px;color:#555;font-size:11px;letter-spacing:1px}
</style>
</head>
<body>
<div class="container">
<div class="online">● <span>ONLINE</span> — 90s / 2000s lovers</div>
<div class="title">THE EMRAAN HASHMI ERA</div>
<div class="subtitle">THE VOICE OF LOVE</div>
<div class="cover">Album Cover</div>
<div class="song"><h2>Your Song</h2><p>Emraan Hashmi Era</p></div>
<div class="progress-area">
<input id="progress" type="range" min="0" max="100" value="0">
<div class="time"><span id="current">0:00</span><span id="duration">0:00</span></div>
</div>
<div class="controls">
<button class="small">↶</button>
<button class="play" id="playBtn">▶</button>
<button class="small">↷</button>
</div>
<div class="footer">MADE FOR THE 90s &amp; 2000s KIDS</div>
</div>
<script>
const audio=new Audio();
const playBtn=document.getElementById("playBtn");
const progress=document.getElementById("progress");
playBtn.onclick=()=>{if(audio.paused){audio.play();playBtn.textContent="❚❚"}else{audio.pause();playBtn.textContent="▶"}};
audio.ontimeupdate=()=>{if(audio.duration)progress.value=audio.currentTime/audio.duration*100};
progress.oninput=()=>{if(audio.duration)audio.currentTime=progress.value/100*audio.duration};
</script>
</body>
</html>
